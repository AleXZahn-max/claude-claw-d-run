<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="clawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#7C2D12" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="#1E293B" stroke="#F97316" stroke-width="2.5"/>
  
  <!-- Left Claw -->
  <path d="M 14 26 C 10 18, 16 12, 22 17 C 20 23, 17 25, 14 26 Z" fill="url(#clawGrad)" filter="url(#glow)"/>
  <path d="M 13 22 C 8 23, 10 30, 16 28 Z" fill="#EA580C"/>

  <!-- Right Claw -->
  <path d="M 50 26 C 54 18, 48 12, 42 17 C 44 23, 47 25, 50 26 Z" fill="url(#clawGrad)" filter="url(#glow)"/>
  <path d="M 51 22 C 56 23, 54 30, 48 28 Z" fill="#EA580C"/>

  <!-- Body -->
  <ellipse cx="32" cy="36" rx="16" ry="13" fill="url(#clawGrad)" filter="url(#glow)"/>
  
  <!-- Belly Highlight -->
  <ellipse cx="32" cy="38" rx="10" ry="7" fill="#FB923C"/>

  <!-- Left Eye -->
  <ellipse cx="26" cy="27" rx="4.5" ry="5.5" fill="#FFFFFF"/>
  <circle cx="27.5" cy="26.5" r="2.5" fill="#0F172A"/>
  <circle cx="28.5" cy="25" r="1" fill="#FFFFFF"/>

  <!-- Right Eye -->
  <ellipse cx="38" cy="27" rx="4.5" ry="5.5" fill="#FFFFFF"/>
  <circle cx="39.5" cy="26.5" r="2.5" fill="#0F172A"/>
  <circle cx="40.5" cy="25" r="1" fill="#FFFFFF"/>

  <!-- Smile -->
  <path d="M 28 39 Q 32 43 36 39" stroke="#7C2D12" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  
  <!-- Legs -->
  <path d="M 22 47 L 18 53 M 27 48 L 26 55 M 37 48 L 38 55 M 42 47 L 46 53" stroke="#C2410C" stroke-width="2.5" stroke-linecap="round"/>
</svg>
